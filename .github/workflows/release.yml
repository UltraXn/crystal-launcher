name: Release Multi-Platform CrystalLauncher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release Draft
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "CrystalLauncher ${{ github.ref_name }}"
          body: |
            ## 🚀 Lanzamiento Multiplataforma de CrystalLauncher ${{ github.ref_name }}
            
            Cliente de escritorio ultraliviano multiplataforma para **CrystalTidesSMP (Minecraft 1.21.1)**.
            
            ### ⚡ Características Principales:
            - **Soporte Multiplataforma**: Disponible para Windows (.exe / .msi), macOS (.dmg) y Linux (.AppImage / .deb).
            - **Autenticación Microsoft OAuth2**: Carga rápida y segura de licencias oficiales.
            - **Sincronización de Mods (SHA-256)**: Verificación instantánea de la biblioteca de mods.
            - **Rendimiento Híbrido**: Motor Tauri v2 + Rust (<30MB RAM).
            
            ---
            *Selecciona el instalador correspondiente a tu sistema operativo a continuación.*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-tauri:
    needs: create-release
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm install

      - name: Build Tauri Client Executable
        run: npm run build:tauri -- ${{ matrix.args }}

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            client/src-tauri/target/release/bundle/msi/*.msi
            client/src-tauri/target/release/bundle/nsis/*.exe
            client/src-tauri/target/release/bundle/dmg/*.dmg
            client/src-tauri/target/release/bundle/appimage/*.AppImage
            client/src-tauri/target/release/bundle/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
