[package]
name = "ctlauncher-installer"
version = "0.1.0"
description = "CTLauncher Installer"
authors = ["CrystalTides"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.3.0", features = [] }
tauri-plugin-opener = "2.2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"

[lib]
name = "ctlauncher_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
